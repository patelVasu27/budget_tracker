name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Must match the npm major version that generated package-lock.json.
          # npm 10 and npm 11 compute the dependency tree differently, and a
          # mismatch makes `npm ci` fail with "Missing <pkg> from lock file".
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci --no-audit 2>&1 | tee /tmp/npm-ci.log || {
            echo "::warning::npm ci failed - falling back to npm install"
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -30 /tmp/npm-ci.log)
            npm install --no-audit
          }

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Run integration tests (RLS isolation)
        run: npx vitest run src/test/integration
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        # Skips gracefully if TEST_DATABASE_URL is not set.
        # To enable: add TEST_DATABASE_URL secret in GitHub repo settings.

      - name: Audit dependencies (critical only)
        run: npm audit --audit-level=critical
        # xlsx reports HIGH (not critical) with fixAvailable: false — excluded by --audit-level=critical.
        # Review moderate/high findings manually on a regular basis.

  deploy:
    name: Deploy to Vercel (production)
    needs: ci
    # Fail-safe: only deploy when ALL of these are true:
    #   1. Push to main (not PR)
    #   2. The 'production' GitHub Environment is configured with protection rules
    #      (configure in: GitHub repo → Settings → Environments → production →
    #       Required reviewers → add yourself. Without this, the job is skipped.)
    #   3. Vercel secrets are present (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'